<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animated login page</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>
<body>

<section class="stage" id="stage" aria-hidden="true">
  <div class="crew">
    <div class="pal tall"><div class="eyes"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div></div>
    <div class="pal round"><div class="eyes"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div></div>
    <div class="pal half"><div class="eyes"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div></div>
  </div>
</section>

<main class="panel">
  <form id="form" novalidate>
    <h1>Welcome back</h1>
    <p class="sub">Log in to pick up where you left off.</p>

    <div class="field">
      <input id="user" type="text" placeholder=" " autocomplete="username">
      <label for="user">Email or username</label>
    </div>

    <div class="field">
      <input id="pass" type="password" placeholder=" " autocomplete="current-password">
      <label for="pass">Password</label>
      <button type="button" class="toggle" id="toggle" aria-label="Show password">Show</button>
    </div>

    <p class="error" id="error" role="alert"></p>
    <button class="go" id="go" type="submit">Log in</button>
    <p class="foot">New here? <a href="signup.html">Create an account</a></p>
  </form>
</main>

<script src="login.js"></script>
</body>
</html>
